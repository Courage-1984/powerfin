<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081B34" />
      <stop offset="50%" stop-color="#0E3364" />
      <stop offset="100%" stop-color="#144E96" />
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#144E96" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#B45309" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="600" rx="24" fill="url(#bgGrad)" />

  <!-- Abstract Blueprint Grid -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="0" y1="500" x2="800" y2="500" />
    <line x1="120" y1="0" x2="120" y2="600" />
    <line x1="280" y1="0" x2="280" y2="600" />
    <line x1="440" y1="0" x2="440" y2="600" />
    <line x1="600" y1="0" x2="600" y2="600" />
  </g>

  <!-- Left Side Main Analytics Card (No Overlap with Right Side) -->
  <g transform="translate(40, 50)" filter="url(#shadow)">
    <rect width="470" height="500" rx="20" fill="rgba(8, 27, 52, 0.82)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="2" />
    <text x="36" y="52" fill="#FFFFFF" font-family="'Montserrat', sans-serif" font-weight="800" font-size="20">TAX STRUCTURING MODEL</text>
    <text x="36" y="80" fill="#38BDF8" font-family="'Inter', sans-serif" font-weight="600" font-size="13" letter-spacing="1">SARS STATUTORY COMPLIANCE ALIGNMENT</text>

    <!-- Bar Charts (Neatly bounded in x=36..434, y=140..420) -->
    <rect x="46" y="340" width="46" height="80" rx="6" fill="url(#barGrad)" />
    <rect x="114" y="290" width="46" height="130" rx="6" fill="url(#barGrad)" />
    <rect x="182" y="230" width="46" height="190" rx="6" fill="url(#barGrad)" />
    <rect x="250" y="250" width="46" height="170" rx="6" fill="url(#barGrad)" />
    <rect x="318" y="180" width="46" height="240" rx="6" fill="url(#barGrad)" />
    <rect x="386" y="130" width="46" height="290" rx="6" fill="url(#goldGrad)" />
    <text x="409" y="118" fill="#F59E0B" font-family="'Inter', sans-serif" font-weight="700" font-size="13" text-anchor="middle">MAX</text>
    
    <!-- Axis lines -->
    <line x1="36" y1="420" x2="444" y2="420" stroke="rgba(255,255,255,0.2)" stroke-width="2" stroke-linecap="round" />
    <text x="36" y="455" fill="#A0AEC0" font-family="'Inter', sans-serif" font-size="13">Provisional returns &amp; IT14 optimizations verified</text>
  </g>

  <!-- Right Side Upper Card: SARS Readiness Stamp -->
  <g transform="translate(540, 50)" filter="url(#shadow)">
    <rect width="220" height="190" rx="20" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    <rect x="24" y="24" width="48" height="48" rx="12" fill="rgba(20, 78, 150, 0.1)" />
    <circle cx="48" cy="48" r="12" stroke="#144E96" stroke-width="3" fill="none" />
    <polyline points="43,48 47,52 54,43" stroke="#144E96" stroke-width="3" fill="none" stroke-linecap="round" />

    <text x="24" y="105" fill="#081B34" font-family="'Montserrat', sans-serif" font-weight="800" font-size="18">SARS Audit Ready</text>
    <text x="24" y="130" fill="#4A5568" font-family="'Inter', sans-serif" font-size="13">100% Statutory records</text>
    <rect x="24" y="145" width="100" height="26" rx="13" fill="#DEF7EC" />
    <text x="38" y="162" fill="#03543F" font-family="'Inter', sans-serif" font-weight="700" font-size="12">✓ Fully Validated</text>
  </g>

  <!-- Right Side Lower Card: Rate Optimization Metric -->
  <g transform="translate(540, 265)" filter="url(#shadow)">
    <rect width="220" height="285" rx="20" fill="rgba(8, 27, 52, 0.9)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1.5" />
    <text x="24" y="45" fill="#38BDF8" font-family="'Montserrat', sans-serif" font-weight="700" font-size="14">TAX EFFICIENCY</text>
    
    <!-- Divider -->
    <line x1="24" y1="65" x2="196" y2="65" stroke="rgba(255,255,255,0.15)" stroke-width="1" />

    <text x="24" y="105" fill="#A0AEC0" font-family="'Inter', sans-serif" font-size="13">Effective Rate Impact:</text>
    <text x="24" y="155" fill="#38BDF8" font-family="'Montserrat', sans-serif" font-weight="800" font-size="42">-18.4%</text>
    
    <text x="24" y="195" fill="#E2E8F0" font-family="'Inter', sans-serif" font-size="13">• Legally sound structuring</text>
    <text x="24" y="225" fill="#E2E8F0" font-family="'Inter', sans-serif" font-size="13">• Zero excessive penalties</text>
    <text x="24" y="255" fill="#E2E8F0" font-family="'Inter', sans-serif" font-size="13">• Proactive compliance</text>
  </g>

  <!-- Glowing Accent Dot -->
  <circle cx="650" cy="150" r="80" fill="#38BDF8" opacity="0.12" filter="blur(25px)" />
</svg>
