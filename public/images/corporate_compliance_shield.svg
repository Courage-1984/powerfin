<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E3364" />
      <stop offset="50%" stop-color="#144E96" />
      <stop offset="100%" stop-color="#081B34" />
    </linearGradient>
    <linearGradient id="shieldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#144E96" />
    </linearGradient>
    <linearGradient id="bgGlint" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081B34" />
      <stop offset="100%" stop-color="#040D1A" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Dark Canvas -->
  <rect width="800" height="600" rx="24" fill="url(#bgGlint)" />

  <!-- Background Radar Circles -->
  <circle cx="400" cy="300" r="260" stroke="rgba(255,255,255,0.03)" fill="none" stroke-width="1" />
  <circle cx="400" cy="300" r="190" stroke="rgba(255,255,255,0.05)" fill="none" stroke-width="1" stroke-dasharray="6,6" />
  <circle cx="400" cy="300" r="110" fill="rgba(56, 189, 248, 0.08)" filter="blur(20px)" />

  <!-- Connecting Governance Lines -->
  <line x1="290" y1="260" x2="320" y2="280" stroke="#38BDF8" stroke-width="2" stroke-dasharray="4,4" />
  <line x1="510" y1="260" x2="480" y2="280" stroke="#38BDF8" stroke-width="2" stroke-dasharray="4,4" />

  <!-- Center Shield (Bounded comfortably between x=320..480) -->
  <g transform="translate(400, 300) scale(1.18)" filter="url(#cardShadow)">
    <path d="M 0 -80 C -60 -70, -75 -60, -75 -30 C -75 25, -50 75, 0 100 C 50 75, 75 25, 75 -30 C 75 -60, 60 -70, 0 -80 Z" 
          fill="url(#shieldGrad)" stroke="url(#shieldBorder)" stroke-width="3" />
    <!-- Inner Lock & Compliance Emblem -->
    <path d="M 0 -50 C -45 -42, -55 -35, -55 -15 C -55 30, -35 60, 0 80 C 35 60, 55 30, 55 -15 C 55 -35, 45 -42, 0 -50 Z" 
          fill="rgba(8, 27, 52, 0.8)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1.5" />
    <circle cx="0" cy="-10" r="16" stroke="#38BDF8" stroke-width="3" fill="none" />
    <rect x="-20" y="-8" width="40" height="32" rx="4" fill="#38BDF8" />
    <circle cx="0" cy="8" r="4" fill="#081B34" />
  </g>
  <text x="400" y="465" fill="#FFFFFF" font-family="'Montserrat', sans-serif" font-weight="800" font-size="20" text-anchor="middle" letter-spacing="1">GOVERNANCE &amp; POPIA</text>
  <text x="400" y="490" fill="#38BDF8" font-family="'Inter', sans-serif" font-weight="600" font-size="14" text-anchor="middle">Full South African Legal Alignment</text>

  <!-- Left Card: CIPC Statutory Register (x=30..290) -->
  <g transform="translate(30, 160)" filter="url(#cardShadow)">
    <rect width="260" height="200" rx="16" fill="rgba(14, 40, 78, 0.92)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.5" />
    <circle cx="28" cy="32" r="10" fill="#38BDF8" opacity="0.2" />
    <circle cx="28" cy="32" r="4" fill="#38BDF8" />
    <text x="50" y="36" fill="#FFFFFF" font-family="'Montserrat', sans-serif" font-weight="700" font-size="16">CIPC &amp; Secretarial</text>
    
    <line x1="20" y1="58" x2="240" y2="58" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
    
    <text x="24" y="90" fill="#E2E8F0" font-family="'Inter', sans-serif" font-size="13">✓ Annual Return Lodgement</text>
    <text x="24" y="120" fill="#E2E8F0" font-family="'Inter', sans-serif" font-size="13">✓ Beneficial Ownership Logs</text>
    <text x="24" y="150" fill="#E2E8F0" font-family="'Inter', sans-serif" font-size="13">✓ Director Amendments</text>
    <text x="24" y="180" fill="#38BDF8" font-family="'Inter', sans-serif" font-weight="600" font-size="12">Statutory Standing: 100%</text>
  </g>

  <!-- Right Card: POPIA Data Security (x=510..770) -->
  <g transform="translate(510, 160)" filter="url(#cardShadow)">
    <rect width="260" height="200" rx="16" fill="rgba(14, 40, 78, 0.92)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.5" />
    <circle cx="28" cy="32" r="10" fill="#10B981" opacity="0.2" />
    <circle cx="28" cy="32" r="4" fill="#10B981" />
    <text x="50" y="36" fill="#FFFFFF" font-family="'Montserrat', sans-serif" font-weight="700" font-size="16">POPIA Data Protection</text>
    
    <line x1="20" y1="58" x2="240" y2="58" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
    
    <text x="24" y="90" fill="#E2E8F0" font-family="'Inter', sans-serif" font-size="13">✓ Confidential Processing</text>
    <text x="24" y="120" fill="#E2E8F0" font-family="'Inter', sans-serif" font-size="13">✓ Encrypted Client Vault</text>
    <text x="24" y="150" fill="#E2E8F0" font-family="'Inter', sans-serif" font-size="13">✓ Lawful SARS Transmission</text>
    <text x="24" y="180" fill="#10B981" font-family="'Inter', sans-serif" font-weight="600" font-size="12">Security Protocol Verified</text>
  </g>
</svg>
