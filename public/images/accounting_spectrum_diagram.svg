<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgSpec" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081B34" />
      <stop offset="100%" stop-color="#0C284D" />
    </linearGradient>
    <linearGradient id="step1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#144E96" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="step2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <linearGradient id="step3Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B45309" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="shadowSpec" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Canvas -->
  <rect width="800" height="600" rx="24" fill="url(#bgSpec)" />

  <!-- Top Title Bar -->
  <text x="400" y="65" fill="#FFFFFF" font-family="'Montserrat', sans-serif" font-weight="800" font-size="26" text-anchor="middle" letter-spacing="1">THE ACCOUNTING &amp; ADVISORY SPECTRUM</text>
  <text x="400" y="95" fill="#38BDF8" font-family="'Inter', sans-serif" font-weight="600" font-size="14" text-anchor="middle" letter-spacing="1">FROM FOUNDATIONAL CASHBOOK RECONS TO STATUTORY AFS EXCELLENCE</text>

  <!-- Connecting Pathway Bar -->
  <rect x="80" y="130" width="640" height="6" rx="3" fill="rgba(255,255,255,0.08)" />
  <rect x="80" y="130" width="640" height="6" rx="3" fill="url(#step2Grad)" opacity="0.6" />

  <!-- Phase 1: Bookkeeping & Reconciliations (x=30..256) -->
  <g transform="translate(30, 150)" filter="url(#shadowSpec)">
    <rect width="226" height="350" rx="16" fill="rgba(14, 40, 78, 0.9)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1.5" />
    <circle cx="113" cy="-15" r="20" fill="url(#step1Grad)" stroke="#FFFFFF" stroke-width="3" />
    <text x="113" y="-9" fill="#FFFFFF" font-family="'Montserrat', sans-serif" font-weight="800" font-size="15" text-anchor="middle">1</text>

    <text x="113" y="45" fill="#FFFFFF" font-family="'Montserrat', sans-serif" font-weight="800" font-size="17" text-anchor="middle">Bookkeeping</text>
    <text x="113" y="66" fill="#38BDF8" font-family="'Inter', sans-serif" font-weight="600" font-size="12" text-anchor="middle">FOUNDATIONAL PRECISION</text>
    <line x1="20" y1="85" x2="206" y2="85" stroke="rgba(255,255,255,0.15)" stroke-width="1" />

    <text x="22" y="120" fill="#E2E8F0" font-family="'Inter', sans-serif" font-size="13">• Daily cashbook recons</text>
    <text x="22" y="150" fill="#E2E8F0" font-family="'Inter', sans-serif" font-size="13">• Bank account matching</text>
    <text x="22" y="180" fill="#E2E8F0" font-family="'Inter', sans-serif" font-size="13">• Debtors &amp; creditors ledgers</text>
    <text x="22" y="210" fill="#E2E8F0" font-family="'Inter', sans-serif" font-size="13">• Audit-ready VAT trails</text>
    <text x="22" y="240" fill="#E2E8F0" font-family="'Inter', sans-serif" font-size="13">• Clean accounting logs</text>

    <rect x="23" y="285" width="180" height="40" rx="8" fill="rgba(56, 189, 248, 0.15)" />
    <text x="113" y="310" fill="#38BDF8" font-family="'Montserrat', sans-serif" font-weight="700" font-size="12" text-anchor="middle">STAGE 1: COMPLETE</text>
  </g>

  <!-- Phase 2: Monthly Management Accounts (x=287..513) -->
  <g transform="translate(287, 150)" filter="url(#shadowSpec)">
    <rect width="226" height="350" rx="16" fill="rgba(14, 40, 78, 0.9)" stroke="rgba(56, 189, 248, 0.5)" stroke-width="2" />
    <circle cx="113" cy="-15" r="22" fill="url(#step2Grad)" stroke="#FFFFFF" stroke-width="3" />
    <text x="113" y="-8" fill="#FFFFFF" font-family="'Montserrat', sans-serif" font-weight="800" font-size="16" text-anchor="middle">2</text>

    <text x="113" y="45" fill="#FFFFFF" font-family="'Montserrat', sans-serif" font-weight="800" font-size="17" text-anchor="middle">Management Accts</text>
    <text x="113" y="66" fill="#38BDF8" font-family="'Inter', sans-serif" font-weight="600" font-size="12" text-anchor="middle">STRATEGIC VISIBILITY</text>
    <line x1="20" y1="85" x2="206" y2="85" stroke="rgba(255,255,255,0.15)" stroke-width="1" />

    <text x="22" y="120" fill="#E2E8F0" font-family="'Inter', sans-serif" font-size="13">• Monthly P&amp;L reporting</text>
    <text x="22" y="150" fill="#E2E8F0" font-family="'Inter', sans-serif" font-size="13">• Budget vs variance tracking</text>
    <text x="22" y="180" fill="#E2E8F0" font-family="'Inter', sans-serif" font-size="13">• Cash flow projections</text>
    <text x="22" y="210" fill="#E2E8F0" font-family="'Inter', sans-serif" font-size="13">• Executive growth metrics</text>
    <text x="22" y="240" fill="#E2E8F0" font-family="'Inter', sans-serif" font-size="13">• Director advisory sessions</text>

    <rect x="23" y="285" width="180" height="40" rx="8" fill="#144E96" />
    <text x="113" y="310" fill="#FFFFFF" font-family="'Montserrat', sans-serif" font-weight="700" font-size="12" text-anchor="middle">STAGE 2: INSIGHTS</text>
  </g>

  <!-- Phase 3: Statutory & Annual Financial Statements (x=544..770) -->
  <g transform="translate(544, 150)" filter="url(#shadowSpec)">
    <rect width="226" height="350" rx="16" fill="rgba(8, 27, 52, 0.95)" stroke="#F59E0B" stroke-width="2" />
    <circle cx="113" cy="-15" r="22" fill="url(#step3Grad)" stroke="#FFFFFF" stroke-width="3" />
    <text x="113" y="-8" fill="#FFFFFF" font-family="'Montserrat', sans-serif" font-weight="800" font-size="16" text-anchor="middle">3</text>

    <text x="113" y="45" fill="#F59E0B" font-family="'Montserrat', sans-serif" font-weight="800" font-size="17" text-anchor="middle">Statutory &amp; AFS</text>
    <text x="113" y="66" fill="#FCE7F3" font-family="'Inter', sans-serif" font-weight="600" font-size="12" text-anchor="middle">IFRS COMPLIANT</text>
    <line x1="20" y1="85" x2="206" y2="85" stroke="rgba(255,255,255,0.15)" stroke-width="1" />

    <text x="22" y="120" fill="#E2E8F0" font-family="'Inter', sans-serif" font-size="13">• Statutory AFS drafting</text>
    <text x="22" y="150" fill="#E2E8F0" font-family="'Inter', sans-serif" font-size="13">• IFRS for SMEs alignment</text>
    <text x="22" y="180" fill="#E2E8F0" font-family="'Inter', sans-serif" font-size="13">• Audit &amp; review ready logs</text>
    <text x="22" y="210" fill="#E2E8F0" font-family="'Inter', sans-serif" font-size="13">• CIPC return lodgement</text>
    <text x="22" y="240" fill="#E2E8F0" font-family="'Inter', sans-serif" font-size="13">• Complete peace of mind</text>

    <rect x="23" y="285" width="180" height="40" rx="8" fill="url(#step3Grad)" />
    <text x="113" y="310" fill="#FFFFFF" font-family="'Montserrat', sans-serif" font-weight="700" font-size="12" text-anchor="middle">STAGE 3: EXCELLENCE</text>
  </g>

  <!-- Footer Philosophy Statement -->
  <text x="400" y="555" fill="#CBD5E1" font-family="'Inter', sans-serif" font-style="italic" font-size="15" text-anchor="middle">"Structured financial discipline designed for growing South African enterprises."</text>
</svg>
