rting</text><text x="22" y="150" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="13">• Budget vs variance tracking</text><text x="22" y="180" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="13">• Cash flow projections</text><text x="22" y="210" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="13">• Executive growth metrics</text><text x="22" y="240" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="13">• Director advisory sessions</text><rect width="180" height="40" x="23" y="285" fill="#144e96" rx="8"/><text x="113" y="310" fill="#fff" font-family="'Montserrat', sans-serif" font-size="12" font-weight="700" text-anchor="middle">STAGE 2: INSIGHTS</text></g><g filter="url(#shadowSpec)" transform="translate(544 150)"><rect width="226" height="350" fill="rgba(8, 27, 52, 0.95)" stroke="#f59e0b" stroke-width="2" rx="16"/><circle cx="113" cy="-15" r="22" fill="url(#step3Grad)" stroke="#fff" stroke-width="3"/><text x="113" y="-8" fill="#fff" font-family="'Montserrat', sans-serif" font-size="16" font-weight="800" text-anchor="middle">3</text><text x="113" y="45" fill="#f59e0b" font-family="'Montserrat', sans-serif" font-size="17" font-weight="800" text-anchor="middle">Statutory &amp; AFS</text><text x="113" y="66" fill="#fce7f3" font-family="'Inter', sans-serif" font-size="12" font-weight="600" text-anchor="middle">IFRS COMPLIANT</text><path stroke="rgba(255,255,255,0.15)" d="M20 85h186"/><text x="22" y="120" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="13">• Statutory AFS drafting</text><text x="22" y="150" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="13">• IFRS for SMEs alignment</text><text x="22" y="180" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="13">• Audit &amp; review ready logs</text><text x="22" y="210" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="13">• CIPC return lodgement</text><text x="22" y="240" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="