<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgPay" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081B34" />
      <stop offset="100%" stop-color="#0F386E" />
    </linearGradient>
    <linearGradient id="barBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#144E96" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <filter id="boxShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="800" height="600" rx="24" fill="url(#bgPay)" />

  <!-- Main Payroll Executive Dashboard Container (x=50..750) -->
  <g transform="translate(50, 45)" filter="url(#boxShadow)">
    <rect width="700" height="510" rx="20" fill="rgba(8, 27, 52, 0.88)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="2" />

    <!-- Top Window Control Header -->
    <rect width="700" height="48" rx="20" fill="rgba(255, 255, 255, 0.05)" />
    <circle cx="28" cy="24" r="6" fill="#F56565" />
    <circle cx="48" cy="24" r="6" fill="#ECC94B" />
    <circle cx="68" cy="24" r="6" fill="#48BB78" />
    <text x="350" y="29" fill="#E2E8F0" font-family="'Montserrat', sans-serif" font-weight="700" font-size="14" text-anchor="middle" letter-spacing="1">CONFIDENTIAL PAYROLL &amp; STATUTORY SUBMISSION PORTAL</text>
    <line x1="0" y1="48" x2="700" y2="48" stroke="rgba(255,255,255,0.1)" stroke-width="1" />

    <!-- Inner Title Section -->
    <text x="40" y="95" fill="#FFFFFF" font-family="'Montserrat', sans-serif" font-weight="800" font-size="22">EMP201 &amp; IRP5 STATUTORY COMPLIANCE</text>
    <text x="40" y="125" fill="#38BDF8" font-family="'Inter', sans-serif" font-weight="600" font-size="14">Automated PAYE, UIF, and SDL Statutory Declarations</text>

    <!-- Row 1: PAYE Tax Allocation -->
    <text x="40" y="180" fill="#E2E8F0" font-family="'Inter', sans-serif" font-weight="600" font-size="15">PAYE Tax Allocation &amp; Matching</text>
    <text x="660" y="180" fill="#38BDF8" font-family="'Inter', sans-serif" font-weight="700" font-size="14" text-anchor="end">100% Reconciled</text>
    <rect x="40" y="195" width="620" height="12" rx="6" fill="rgba(255,255,255,0.1)" />
    <rect x="40" y="195" width="620" height="12" rx="6" fill="url(#barBlue)" />

    <!-- Row 2: UIF & SDL Contributions -->
    <text x="40" y="255" fill="#E2E8F0" font-family="'Inter', sans-serif" font-weight="600" font-size="15">UIF &amp; SDL Labour Contributions</text>
    <text x="660" y="255" fill="#10B981" font-family="'Inter', sans-serif" font-weight="700" font-size="14" text-anchor="end">Submitted &amp; Up To Date</text>
    <rect x="40" y="270" width="620" height="12" rx="6" fill="rgba(255,255,255,0.1)" />
    <rect x="40" y="270" width="620" height="12" rx="6" fill="#10B981" />

    <!-- Row 3: Bi-Annual EMP501 Recons -->
    <text x="40" y="330" fill="#E2E8F0" font-family="'Inter', sans-serif" font-weight="600" font-size="15">Bi-Annual EMP501 Reconciliation &amp; IRP5 Drafting</text>
    <text x="660" y="330" fill="#F59E0B" font-family="'Inter', sans-serif" font-weight="700" font-size="14" text-anchor="end">Audit Verified</text>
    <rect x="40" y="345" width="620" height="12" rx="6" fill="rgba(255,255,255,0.1)" />
    <rect x="40" y="345" width="620" height="12" rx="6" fill="#F59E0B" />

    <!-- Bottom Executive Verification Footer -->
    <line x1="40" y1="405" x2="660" y2="405" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
    
    <rect x="40" y="428" width="230" height="48" rx="8" fill="rgba(20, 78, 150, 0.3)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1" />
    <text x="155" y="457" fill="#FFFFFF" font-family="'Inter', sans-serif" font-weight="600" font-size="13" text-anchor="middle">✓ SARS eFiling Integration</text>

    <rect x="290" y="428" width="220" height="48" rx="8" fill="rgba(20, 78, 150, 0.3)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1" />
    <text x="400" y="457" fill="#FFFFFF" font-family="'Inter', sans-serif" font-weight="600" font-size="13" text-anchor="middle">✓ Zero Late Penalty Risk</text>

    <rect x="530" y="428" width="130" height="48" rx="8" fill="#144E96" />
    <text x="595" y="457" fill="#FFFFFF" font-family="'Montserrat', sans-serif" font-weight="700" font-size="13" text-anchor="middle">SECURE</text>
  </g>
</svg>
